name: build-and-push-with-ver

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      DOCKERHUB_USER_TED:
        required: true
      DOCKERHUB_TOKEN_TED:
        required: true

jobs:
  build-and-push-with-ver:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU for Docker Buildx
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USER_TED }}
        password: ${{ secrets.DOCKERHUB_TOKEN_TED }}
    - name: Build APP and push
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: tedimaging/stock-linebot:foodingredient.${{ inputs.version }}
        context: .
        file: dockerfile/foodingredient-app.dockerfile
        no-cache: true
        platforms: linux/amd64
