name: regular-test-services

on:
  schedule:
  - cron:  '0 23 * * *'    # At every day 23:00 

jobs:
  regular-test-services:
    uses: ./.github/workflows/lib-test-services.yml
    secrets: inherit
  data-test-prod:
    environment: prod
    runs-on: service
    steps:
    - uses: actions/checkout@v3
    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.TED_PK }}
        known_hosts: 'just-a-placeholder-so-we-dont-get-errors'
    - name: Adding Known Hosts
      run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - name: Install integration test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Create .env
      run: |
        touch .env
        echo "ENV=${{ inputs.environment }}" >> .env
        echo "MONGO_DB_CLOUD_HOST=${{ secrets.MONGO_DB_CLOUD_HOST }}" >> .env
        echo "MONGO_DB_TESTING_USER=${{ secrets.MONGO_DB_USER }}" >> .env
        echo "MONGO_DB_TESTING_PASSWORD=${{ secrets.MONGO_DB_PASSWORD }}" >> .env
        echo "MONGO_DB_TESTING_DATABASE=${{ secrets.MONGO_DB_DATABASE }}" >> .env
        echo "TZ=Asia/Taipei" >> .env
    - run: python -m pytest --durations=5 tests/data_test
